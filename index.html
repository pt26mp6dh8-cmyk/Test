<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Script Encryptor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
  }
  .container {
    background: #16162a;
    border: 1px solid #2a2a4a;
    border-radius: 16px;
    padding: 30px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
  }
  h1 {
    font-size: 22px;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #7c3aed, #06b6d4);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  label { display: block; font-size: 13px; margin: 14px 0 6px; color: #aaa; }
  textarea, input[type=text] {
    width: 100%;
    background: #0e0e1c;
    border: 1px solid #2a2a4a;
    color: #d0d0e0;
    border-radius: 10px;
    padding: 12px;
    font-family: 'Consolas', monospace;
    font-size: 13px;
    outline: none;
    resize: vertical;
    user-select: text;
  }
  textarea:focus, input:focus { border-color: #7c3aed; }
  #inputScript { height: 180px; }
  #outputLua   { height: 140px; }
  #outputLoad  { height: 70px; }
  button {
    margin-top: 16px;
    padding: 12px 26px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #7c3aed, #06b6d4);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }
  button:hover { transform: translateY(-2px); filter: brightness(1.1); }
  button:active { transform: translateY(0); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1; min-width: 200px; }
  .note {
    margin-top: 18px;
    padding: 12px;
    background: #1e1e38;
    border-left: 3px solid #06b6d4;
    border-radius: 6px;
    font-size: 12px;
    color: #999;
    line-height: 1.6;
  }
  .hidden-msg {
    position: fixed; inset: 0;
    background: #000; color: #f00;
    display: none;
    align-items: center; justify-content: center;
    font-size: 30px; z-index: 99999;
  }
</style>
</head>
<body>

<div class="hidden-msg" id="blockMsg">🚫 KHÔNG ĐƯỢC XEM CODE</div>

<div class="container">
  <h1>🔐 Lua Script Encryptor</h1>
  <p class="sub">Mã hóa script Lua thành dạng loadstring an toàn</p>

  <label>Script Lua gốc</label>
  <textarea id="inputScript" placeholder="-- Nhập script Lua của bạn vào đây...&#10;print('Hello world')"></textarea>

  <div class="row">
    <div>
      <label>Key mã hóa (để trống = random)</label>
      <input type="text" id="keyInput" placeholder="VD: mySecretKey123">
    </div>
    <div>
      <label>URL file .lua (nơi bạn up file mã hóa)</label>
      <input type="text" id="urlInput" placeholder="https://pastebin.com/raw/xxxxx">
    </div>
  </div>

  <button onclick="encrypt()">⚡ Mã hóa</button>

  <label>📄 Nội dung file .lua (up lên Pastebin/GitHub raw)</label>
  <textarea id="outputLua" readonly placeholder="(Chưa có)"></textarea>

  <label>🚀 Dòng loadstring đưa cho người dùng</label>
  <textarea id="outputLoad" readonly placeholder="(Chưa có)"></textarea>

  <div class="note">
    <b>Hướng dẫn:</b> Copy nội dung ở ô <b>file .lua</b> → up lên <b>pastebin.com</b> (raw) hoặc <b>GitHub raw</b> → dán URL vào ô trên → copy dòng <b>loadstring</b> ở dưới để chia sẻ.
  </div>
</div>

<script>
/* ========== BẢO VỆ CHỐNG XEM CODE ========== */
(function protect() {
  // Chặn chuột phải
  document.addEventListener('contextmenu', e => e.preventDefault());

  // Chặn phím tắt devtools
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && ['i','j','c','k'].includes(k)) ||
      (e.ctrlKey && k === 'u') ||
      (e.ctrlKey && k === 's') ||
      (e.ctrlKey && e.shiftKey && k === 'e')
    ) {
      e.preventDefault();
      return false;
    }
  });

  // Chặn kéo thả / chọn
  document.addEventListener('dragstart', e => e.preventDefault());
  document.addEventListener('selectstart', e => {
    if (e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'INPUT') {
      e.preventDefault();
    }
  });

  // Phát hiện mở devtools → che nội dung
  let devOpen = false;
  setInterval(() => {
    const t0 = performance.now();
    // debugger;
    const t1 = performance.now();
    if (t1 - t0 > 100) devOpen = true;
    const wDiff = window.outerWidth - window.innerWidth > 160;
    const hDiff = window.outerHeight - window.innerHeight > 160;
    if (wDiff || hDiff) devOpen = true;
    document.getElementById('blockMsg').style.display = devOpen ? 'flex' : 'none';
  }, 1000);
})();

/* ========== HÀM MÃ HÓA ========== */
function xorString(str, key) {
  let out = '';
  for (let i = 0; i < str.length; i++) {
    out += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return out;
}

function randomKey(len = 16) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function encrypt() {
  const input = document.getElementById('inputScript').value;
  if (!input.trim()) {
    alert('Vui lòng nhập script Lua!');
    return;
  }

  let key = document.getElementById('keyInput').value.trim() || randomKey();
  const url = document.getElementById('urlInput').value.trim() || 'URL_FILE_LUA_CUA_BAN.lua';

  // XOR rồi Base64
  const xored = xorString(input, key);
  const b64 = btoa(unescape(encodeURIComponent(xored)));

  // Sinh file .lua decoder
  const luaFile = `-- Encrypted Lua Script
local _d="${b64}"
local _k="${key}"
local _b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
local function _dc(s)
  s=s:gsub('[^'.._b..'=]','')
  local out=s:gsub('.',function(x)
    if x=='=' then return '' end
    local r='';local f=(_b:find(x)-1)
    for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end
    return r
  end)
  local bytes={}
  for x in out:gmatch('%d%d%d?%d?%d?%d?%d?%d?') do
    if #x==8 then
      local c=0
      for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end
      bytes[#bytes+1]=string.char(c)
    end
  end
  return table.concat(bytes)
end
local _dec=_dc(_d)
local _res={}
for i=1,#_dec do
  local c=string.byte(_dec,i)
  local k=string.byte(_k,(i-1)%#_k+1)
  _res[i]=string.char(bit32.bxor(c,k))
end
local _code=table.concat(_res)
local _fn,err=loadstring(_code)
if _fn then _fn() else warn('[Encrypted Script Error] '..tostring(err)) end
`;

  document.getElementById('outputLua').value = luaFile;
  document.getElementById('outputLoad').value =
    `loadstring(game:HttpGet("${url}"))()`;

  // Cho phép copy
  document.getElementById('outputLua').select();
  document.getElementById('outputLua').setSelectionRange(0, 0);
}

/* Chống dò JS trong console */
setInterval(() => {
  try { console.clear(); } catch(e) {}
}, 2000);
</script>
</body>
</html>
